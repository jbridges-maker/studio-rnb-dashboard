<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio RNB - Time Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: #191919;
            color: #ffffff;
            padding: 24px;
            min-height: 100vh;
        }
        
        .dashboard {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
        }
        
        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .header h1 {
            font-size: 24px;
            font-weight: 600;
            color: #C9A227;
        }
        
        .live-badge {
            font-size: 11px;
            background: rgba(76, 175, 80, 0.2);
            color: #4CAF50;
            padding: 4px 10px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        
        .live-dot {
            width: 6px;
            height: 6px;
            background: #4CAF50;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
        
        .refresh-btn {
            background: #333;
            border: 1px solid #444;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }
        
        .refresh-btn:hover {
            background: #444;
        }
        
        .loading {
            text-align: center;
            padding: 60px;
            color: #888;
        }
        
        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #C9A227;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* Summary Cards */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }
        
        .card {
            background: #252525;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid #333;
        }
        
        .card-label {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }
        
        .card-value {
            font-size: 36px;
            font-weight: 700;
        }
        
        .card-value.allocated { color: #C9A227; }
        .card-value.logged { color: #4CAF50; }
        .card-value.remaining { color: #64B5F6; }
        .card-value.remaining.negative { color: #f44336; }
        .card-value.projects { color: #CE93D8; }
        
        .card-subtitle {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
        }
        
        /* Charts Section */
        .charts-section {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            margin-bottom: 32px;
        }
        
        .chart-card {
            background: #252525;
            border-radius: 12px;
            padding: 24px;
            border: 1px solid #333;
        }
        
        .chart-card h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #fff;
        }
        
        .chart-container {
            position: relative;
            height: 200px;
        }
        
        /* Phase Cards with Tasks */
        .phases-section {
            margin-bottom: 32px;
        }
        
        .phases-section h2 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #fff;
        }
        
        .phase-card {
            background: #252525;
            border-radius: 12px;
            border: 1px solid #333;
            margin-bottom: 16px;
            overflow: hidden;
        }
        
        .phase-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }
        
        .phase-header:hover {
            background: rgba(255,255,255,0.02);
        }
        
        .phase-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        
        .phase-name {
            font-size: 16px;
            font-weight: 600;
        }
        
        .phase-tag {
            font-size: 11px;
            padding: 4px 10px;
            border-radius: 4px;
            font-weight: 500;
        }
        
        .phase-sd { background: #1E3A5F; color: #64B5F6; }
        .phase-dd { background: #3E2723; color: #FFAB91; }
        .phase-cd { background: #1B5E20; color: #81C784; }
        .phase-intake { background: #4A148C; color: #CE93D8; }
        .phase-permitting { background: #E65100; color: #FFB74D; }
        .phase-complete { background: #1B5E20; color: #81C784; }
        .phase-default { background: #333; color: #888; }
        
        .phase-stats {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        
        .phase-stat {
            text-align: right;
        }
        
        .phase-stat-label {
            font-size: 10px;
            color: #666;
            text-transform: uppercase;
        }
        
        .phase-stat-value {
            font-size: 14px;
            font-weight: 600;
            color: #C9A227;
        }
        
        .phase-progress {
            padding: 0 20px 16px;
        }
        
        .phase-progress-bar {
            background: #333;
            border-radius: 8px;
            height: 8px;
            overflow: hidden;
        }
        
        .phase-progress-fill {
            height: 100%;
            border-radius: 8px;
            transition: width 0.5s ease;
        }
        
        .progress-green { background: linear-gradient(90deg, #4CAF50, #81C784); }
        .progress-yellow { background: linear-gradient(90deg, #FF9800, #FFB74D); }
        .progress-red { background: linear-gradient(90deg, #f44336, #E57373); }
        
        .phase-progress-text {
            display: flex;
            justify-content: space-between;
            margin-top: 8px;
            font-size: 11px;
            color: #666;
        }
        
        /* Tasks List */
        .tasks-list {
            padding: 0 20px 20px;
        }
        
        .tasks-header {
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .task-row {
            display: grid;
            grid-template-columns: 24px 1fr 80px 100px 80px;
            align-items: center;
            gap: 12px;
            padding: 10px 0;
            border-bottom: 1px solid #2a2a2a;
            font-size: 13px;
        }
        
        .task-row:last-child {
            border-bottom: none;
        }
        
        .task-checkbox {
            width: 18px;
            height: 18px;
            border-radius: 4px;
            border: 2px solid #444;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .task-checkbox.done {
            background: #4CAF50;
            border-color: #4CAF50;
        }
        
        .task-checkbox.done::after {
            content: '✓';
            color: white;
            font-size: 12px;
        }
        
        .task-checkbox.in-progress {
            border-color: #FF9800;
            background: rgba(255, 152, 0, 0.2);
        }
        
        .task-name {
            color: #ddd;
        }
        
        .task-name.done {
            text-decoration: line-through;
            color: #666;
        }
        
        .task-effort {
            color: #888;
            text-align: right;
        }
        
        .task-owner {
            color: #888;
            font-size: 12px;
        }
        
        .task-status {
            font-size: 10px;
            padding: 3px 8px;
            border-radius: 10px;
            text-align: center;
            font-weight: 500;
        }
        
        .status-done { background: rgba(76, 175, 80, 0.2); color: #4CAF50; }
        .status-in-progress { background: rgba(255, 152, 0, 0.2); color: #FF9800; }
        .status-not-started { background: rgba(156, 163, 175, 0.2); color: #9CA3AF; }
        .status-in-review { background: rgba(139, 92, 246, 0.2); color: #8B5CF6; }
        
        .no-tasks {
            color: #555;
            font-size: 13px;
            font-style: italic;
            padding: 10px 0;
        }
        
        .expand-icon {
            color: #666;
            transition: transform 0.2s;
        }
        
        .phase-card.collapsed .tasks-list {
            display: none;
        }
        
        .phase-card.collapsed .expand-icon {
            transform: rotate(-90deg);
        }
        
        /* Unassigned Tasks */
        .unassigned-section {
            background: #252525;
            border-radius: 12px;
            border: 1px solid #333;
            padding: 20px;
            margin-bottom: 32px;
        }
        
        .unassigned-section h3 {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 16px;
            color: #888;
        }
        
        .last-updated {
            font-size: 11px;
            color: #555;
            text-align: right;
            margin-top: 16px;
        }
        
        .error-banner {
            background: rgba(244, 67, 54, 0.1);
            border: 1px solid rgba(244, 67, 54, 0.3);
            border-radius: 8px;
            padding: 16px;
            color: #f44336;
            margin-bottom: 24px;
        }
        
        /* Responsive */
        @media (max-width: 900px) {
            .summary-cards {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts-section {
                grid-template-columns: 1fr;
            }
            .task-row {
                grid-template-columns: 24px 1fr 60px;
            }
            .task-owner, .task-effort {
                display: none;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard" id="app">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading dashboard data...</p>
        </div>
    </div>

    <script>
        const API_URL = 'https://studio-rnb-api.jbridges-c38.workers.dev';

        let dashboardData = null;
        let hoursChart = null;
        let phaseChart = null;

        async function fetchData() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error(`API Error: ${response.status}`);
                dashboardData = await response.json();
                if (dashboardData.error) throw new Error(dashboardData.error);
                renderDashboard();
            } catch (error) {
                document.getElementById('app').innerHTML = `
                    <div class="header">
                        <div class="header-left"><h1>📊 Studio RNB Dashboard</h1></div>
                        <button class="refresh-btn" onclick="fetchData()">🔄 Retry</button>
                    </div>
                    <div class="error-banner"><strong>Error:</strong> ${error.message}</div>
                `;
            }
        }

        function getPhaseClass(phase) {
            const map = {
                'SD': 'phase-sd', 'DD': 'phase-dd', 'CD': 'phase-cd',
                'Client Intake': 'phase-intake', 'Permitting': 'phase-permitting', 'Complete': 'phase-complete'
            };
            return map[phase] || 'phase-default';
        }

        function getProgressClass(pct) {
            if (pct > 100) return 'progress-red';
            if (pct > 85) return 'progress-yellow';
            return 'progress-green';
        }

        function getStatusClass(status) {
            const s = status.toLowerCase();
            if (s === 'done') return 'status-done';
            if (s === 'in progress') return 'status-in-progress';
            if (s === 'in review') return 'status-in-review';
            return 'status-not-started';
        }

        function getCheckboxClass(status) {
            const s = status.toLowerCase();
            if (s === 'done') return 'done';
            if (s === 'in progress') return 'in-progress';
            return '';
        }

        function renderDashboard() {
            const data = dashboardData;
            const completionPct = data.totalAllocated > 0 ? Math.round((data.totalLogged / data.totalAllocated) * 100) : 0;
            
            // Find unassigned tasks
            const unassignedTasks = data.tasks.filter(t => !t.phaseId);
            
            // Build phase cards with tasks
            let phasesHTML = '';
            data.phases.forEach(phase => {
                const pct = phase.percentage;
                const progressClass = getProgressClass(pct);
                const phaseClass = getPhaseClass(phase.phase);
                
                let tasksHTML = '';
                if (phase.tasks && phase.tasks.length > 0) {
                    phase.tasks.forEach(task => {
                        const statusClass = getStatusClass(task.status);
                        const checkboxClass = getCheckboxClass(task.status);
                        const nameClass = task.status.toLowerCase() === 'done' ? 'done' : '';
                        tasksHTML += `
                            <div class="task-row">
                                <div class="task-checkbox ${checkboxClass}"></div>
                                <div class="task-name ${nameClass}">${task.action}</div>
                                <div class="task-effort">${task.effort || '-'} hrs</div>
                                <div class="task-owner">${task.owner}</div>
                                <div class="task-status ${statusClass}">${task.status}</div>
                            </div>
                        `;
                    });
                } else {
                    tasksHTML = '<div class="no-tasks">No tasks assigned to this phase</div>';
                }
                
                phasesHTML += `
                    <div class="phase-card">
                        <div class="phase-header" onclick="this.parentElement.classList.toggle('collapsed')">
                            <div class="phase-info">
                                <span class="phase-name">${phase.displayName}</span>
                                <span class="phase-tag ${phaseClass}">${phase.phase}</span>
                            </div>
                            <div class="phase-stats">
                                <div class="phase-stat">
                                    <div class="phase-stat-label">Budget</div>
                                    <div class="phase-stat-value">${phase.hoursAllocated} hrs</div>
                                </div>
                                <div class="phase-stat">
                                    <div class="phase-stat-label">Logged</div>
                                    <div class="phase-stat-value">${phase.hoursLogged} hrs</div>
                                </div>
                                <div class="phase-stat">
                                    <div class="phase-stat-label">Tasks</div>
                                    <div class="phase-stat-value">${phase.tasks ? phase.tasks.length : 0}</div>
                                </div>
                                <span class="expand-icon">▼</span>
                            </div>
                        </div>
                        <div class="phase-progress">
                            <div class="phase-progress-bar">
                                <div class="phase-progress-fill ${progressClass}" style="width: ${Math.min(pct, 100)}%"></div>
                            </div>
                            <div class="phase-progress-text">
                                <span>${phase.taskHoursTotal || 0} hrs assigned to tasks</span>
                                <span>${Math.round(pct)}% used</span>
                            </div>
                        </div>
                        <div class="tasks-list">
                            <div class="tasks-header">📋 Tasks (${phase.tasks ? phase.tasks.length : 0})</div>
                            ${tasksHTML}
                        </div>
                    </div>
                `;
            });
            
            // Unassigned tasks section
            let unassignedHTML = '';
            if (unassignedTasks.length > 0) {
                let unassignedTasksHTML = '';
                unassignedTasks.forEach(task => {
                    const statusClass = getStatusClass(task.status);
                    const checkboxClass = getCheckboxClass(task.status);
                    unassignedTasksHTML += `
                        <div class="task-row">
                            <div class="task-checkbox ${checkboxClass}"></div>
                            <div class="task-name">${task.action}</div>
                            <div class="task-effort">${task.effort || '-'} hrs</div>
                            <div class="task-owner">${task.owner}</div>
                            <div class="task-status ${statusClass}">${task.status}</div>
                        </div>
                    `;
                });
                unassignedHTML = `
                    <div class="unassigned-section">
                        <h3>⚠️ Unassigned Tasks (${unassignedTasks.length})</h3>
                        ${unassignedTasksHTML}
                    </div>
                `;
            }

            document.getElementById('app').innerHTML = `
                <div class="header">
                    <div class="header-left">
                        <h1>📊 Studio RNB Dashboard</h1>
                        <div class="live-badge"><span class="live-dot"></span> Live</div>
                    </div>
                    <button class="refresh-btn" onclick="refreshData(this)">🔄 Refresh</button>
                </div>
                
                <div class="summary-cards">
                    <div class="card">
                        <div class="card-label">Hours Allocated</div>
                        <div class="card-value allocated">${data.totalAllocated}</div>
                        <div class="card-subtitle">Total budget</div>
                    </div>
                    <div class="card">
                        <div class="card-label">Hours Logged</div>
                        <div class="card-value logged">${data.totalLogged}</div>
                        <div class="card-subtitle">${completionPct}% used</div>
                    </div>
                    <div class="card">
                        <div class="card-label">Hours Remaining</div>
                        <div class="card-value remaining ${data.totalRemaining < 0 ? 'negative' : ''}">${Math.abs(data.totalRemaining)}</div>
                        <div class="card-subtitle">${data.totalRemaining >= 0 ? 'Available' : 'Over budget'}</div>
                    </div>
                    <div class="card">
                        <div class="card-label">Total Tasks</div>
                        <div class="card-value projects">${data.tasks.length}</div>
                        <div class="card-subtitle">${data.phases.length} phases</div>
                    </div>
                </div>
                
                <div class="charts-section">
                    <div class="chart-card">
                        <h3>Hours Breakdown</h3>
                        <div class="chart-container"><canvas id="hoursChart"></canvas></div>
                    </div>
                    <div class="chart-card">
                        <h3>Hours by Phase</h3>
                        <div class="chart-container"><canvas id="phaseChart"></canvas></div>
                    </div>
                </div>
                
                ${unassignedHTML}
                
                <div class="phases-section">
                    <h2>📁 Phases & Tasks</h2>
                    ${phasesHTML}
                </div>
                
                <div class="last-updated">Last updated: ${new Date().toLocaleString()}</div>
            `;

            initCharts();
        }

        async function refreshData(btn) {
            btn.innerHTML = '⏳ Loading...';
            await fetchData();
            btn.innerHTML = '🔄 Refresh';
        }

        function initCharts() {
            const data = dashboardData;
            if (hoursChart) hoursChart.destroy();
            if (phaseChart) phaseChart.destroy();

            const hoursCtx = document.getElementById('hoursChart');
            if (hoursCtx) {
                hoursChart = new Chart(hoursCtx.getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: ['Logged', 'Remaining'],
                        datasets: [{
                            data: [data.totalLogged, Math.max(data.totalRemaining, 0)],
                            backgroundColor: ['#4CAF50', '#333'],
                            borderWidth: 0,
                            cutout: '70%'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: {
                            legend: { position: 'bottom', labels: { color: '#888', padding: 20 } }
                        }
                    }
                });
            }

            const phaseCtx = document.getElementById('phaseChart');
            if (phaseCtx && Object.keys(data.phaseBreakdown).length > 0) {
                const colors = {
                    'SD': '#64B5F6', 'DD': '#FFAB91', 'CD': '#81C784',
                    'Client Intake': '#CE93D8', 'Permitting': '#FFB74D', 'Complete': '#81C784'
                };
                const labels = Object.keys(data.phaseBreakdown);
                const values = Object.values(data.phaseBreakdown);
                
                phaseChart = new Chart(phaseCtx.getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{ data: values, backgroundColor: labels.map(l => colors[l] || '#888'), borderRadius: 6 }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, grid: { color: '#333' }, ticks: { color: '#888' } },
                            x: { grid: { display: false }, ticks: { color: '#888' } }
                        },
                        plugins: { legend: { display: false } }
                    }
                });
            }
        }

        document.addEventListener('DOMContentLoaded', fetchData);
    </script>
</body>
</html>
